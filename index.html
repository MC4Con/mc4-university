<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#1c232b; --muted:#66707b; --line:#e2ddd3; --soft:#f8f6f2;
  --accent:#e07a12; --accent-ink:#ffffff; --danger:#c0392b; --ok:#2e9d5b;
  --exposure:#7d8b99; --training:#2f78c8; --guidance:#cf8f12; --review:#2e9d5b;
  --exposure-bg:#eef1f4; --training-bg:#e8f1fb; --guidance-bg:#fbf3e2; --review-bg:#e7f5ec;
  --radius:12px; --shadow:0 1px 2px rgba(20,25,30,.06),0 4px 14px rgba(20,25,30,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.2px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}

/* top bar */
.topbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.crest{width:42px;height:42px;object-fit:contain;display:block;flex:none}
.crest-lg{width:190px;max-width:70%;height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:15px;color:#fff}
.brand b{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:20px;font-weight:700;display:block;line-height:1}
.brand small{color:#aab3bd;font-size:12px}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{background:none;border:0;color:#c9d0d7;padding:8px 12px;border-radius:8px;font-weight:600}
.nav button.on,.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.spacer{flex:1}
.who{color:#aab3bd;font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cfc8bb}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost-dark{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.banner{background:#fff4e8;border-bottom:1px solid #f3d6b8;color:#7a4510;padding:8px 20px;font-size:13px}

.page{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.tile{padding:14px 16px}
.tile .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.tile .val{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:32px;font-weight:700;margin-top:2px}
.phase-counts{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.pc{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.pc b{color:var(--ink);font-size:15px}
.dot{width:9px;height:9px;border-radius:50%}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px}
.seg{display:inline-flex;background:#e8e4dc;border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* trainee rows */
.rows{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:minmax(180px,1.4fr) 150px minmax(240px,2fr) 90px 80px;gap:16px;align-items:center;padding:12px 16px;cursor:pointer;transition:border-color .15s}
.trow:hover{border-color:#cdbfae}
.trow .nm{font-weight:700;font-size:16px}
.trow .sub{color:var(--muted);font-size:13px}
.wkbadge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.minibars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mb .t{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
.bar{height:7px;background:#ece8e0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.score{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:28px;text-align:right;line-height:1}
.score small{display:block;font-family:Barlow,sans-serif;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.att{text-align:right;font-weight:700}
.att small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* trainee detail */
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:0;margin-bottom:12px}
.back:hover{color:var(--ink)}
.thead{display:grid;grid-template-columns:1.2fr 2fr;gap:24px;padding:20px;margin-bottom:16px}
.thead h1{font-size:34px;font-weight:700}
.meta{color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.meta b{color:var(--ink)}
.hbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.scorebox{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:center}
.bigscore{text-align:center;border-right:1px solid var(--line);padding-right:14px}
.bigscore .n{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:56px;font-weight:700;line-height:1}
.bigscore .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.phasebars{display:flex;flex-direction:column;gap:8px}
.pb{display:grid;grid-template-columns:78px 1fr 64px;gap:10px;align-items:center;font-size:13px;font-weight:600}
.pb .bar{height:10px}
.pb .r{text-align:right;color:var(--muted)}
.sidestats{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sidestats b{color:var(--ink)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* skills grid */
.grid-wrap{overflow:auto;max-height:calc(100vh - 160px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:0;text-align:center}
.grid thead th{position:sticky;background:var(--card);z-index:2;font-size:12px}
.grid thead tr:first-child th{top:0;height:32px}
.grid thead tr:nth-child(2) th{top:32px;height:28px;color:var(--muted);font-weight:600}
.grid th.sk,.grid td.sk{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;padding:0 12px;min-width:220px;font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.grid thead th.sk{z-index:3}
.grid th.ph{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:#fff}
.grid td{height:34px}
.grid td.c{min-width:46px}
.grid .gs{border-left:2px solid var(--card)}
.grid tbody tr:hover td{background:#fbfaf7}
.grid tbody tr:hover td.sk{background:#fbfaf7}
.x{width:30px;height:24px;border-radius:6px;border:1.5px dashed transparent;background:transparent;font-weight:800;font-size:15px;color:transparent;line-height:1}
.editable .x:hover{border-color:#c9c1b3;color:#c9c1b3}
.x.on{color:#fff;border-style:solid}
.x:disabled{cursor:default}
.curcol{background:#fff8ef!important}
.grid thead th.curwk{color:var(--accent)!important;font-weight:800}
.pills{display:flex;gap:3px;justify-content:center;padding:0 10px}
.pill{width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:800;display:grid;place-items:center;background:#ece8e0;color:#a39b8d}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.legend div{font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:10px;line-height:1.4}
.legend b{display:block;color:var(--ink);font-family:"Barlow Condensed",Barlow,sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.5px}

/* weekly forms */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wkcard{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.wkcard h4{margin:0 0 8px;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.wkcard.cur{border-color:var(--accent);box-shadow:0 0 0 2px #fbe2cf}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
textarea.inp{resize:vertical;min-height:60px}
.inp:focus,.search:focus{outline:2px solid #f6c9a6;border-color:var(--accent)}
.stabrow{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.stabrow .w{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:16px;padding-top:6px}
.stabrow .w small{display:block;font-family:Barlow,sans-serif;font-size:11px;color:var(--muted);font-weight:600}
.raters{display:flex;flex-direction:column}
.rater{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.rater .n{font-weight:600}
.rate button{border:1px solid var(--line);background:#fff;padding:6px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.rate button:first-child{border-radius:8px 0 0 8px}
.rate button:last-child{border-radius:0 8px 8px 0}
.rate button+button{border-left:0}
.rate button.on.GOOD{background:var(--ok);color:#fff;border-color:var(--ok)}
.rate button.on.OK{background:var(--guidance);color:#fff;border-color:var(--guidance)}
.rate button.on.POOR{background:var(--danger);color:#fff;border-color:var(--danger)}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}

/* settings */
.settings{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.settings h2{font-size:22px;margin-bottom:4px}
.skill-ed{display:flex;flex-direction:column;gap:4px;max-height:520px;overflow:auto;margin:10px 0}
.skill-ed .r{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center}
.skill-ed .r.off .inp{color:#a39b8d;text-decoration:line-through}
.skill-ed .num{color:var(--muted);font-size:12px;text-align:right}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px;font-size:13px;color:var(--muted)}
.iconbtn:hover{color:var(--ink)}
.addrow{display:flex;gap:8px}
.weights{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.code{background:#1c232b;color:#d6dde4;border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:200px;overflow:auto;white-space:pre}
ol.steps{padding-left:20px;margin:8px 0;line-height:1.55;font-size:14px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(20,25,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:100%;max-width:440px;padding:22px}
.modal h2{font-size:24px;margin-bottom:14px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.mfoot .left{margin-right:auto}
.printhead{display:none}
@media print{
  .printhead{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1c232b;padding-bottom:10px;margin-bottom:14px}
  .printhead img{width:70px;height:auto}
  .printhead b{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:24px;display:block;line-height:1.1}
  .printhead small{color:#555;font-size:12px}
  .printhead .pd{margin-left:auto;text-align:right;font-size:12px;color:#555}
  #updbar{display:none!important}
  .bookbtn,.whobtn{display:none!important}
  .crew{padding:0}
}
#updbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:600;max-width:calc(100vw - 32px)}
.whobtn{background:none;border:0;color:#aab3bd;font-size:13px;padding:6px 8px;border-radius:8px}
.whobtn:hover{background:rgba(255,255,255,.1);color:#fff}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1}
#toast.err{background:var(--danger)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#2a333d,#141a20)}
.login .card{width:100%;max-width:380px;padding:26px}
.login .logo{width:52px;height:52px;font-size:22px;border-radius:12px;margin:0 auto 10px}
.login h1{text-align:center;font-size:30px}
.login .tag{text-align:center;color:var(--muted);margin:2px 0 18px;font-size:14px}
.login .seg{display:flex;margin-bottom:16px}
.login .seg button{flex:1}
.pindots{display:flex;justify-content:center;gap:12px;margin:6px 0 16px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid #c9c1b3}
.pindots i.f{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:58px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-family:"Barlow Condensed",Barlow,sans-serif;font-size:26px;font-weight:600}
.keypad button:active{background:#ece6db}
.keypad .go{background:var(--accent);border-color:var(--accent);color:#fff;font-size:18px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px}
.err-msg{color:var(--danger);font-size:13px;text-align:center;min-height:18px;margin-top:6px;font-weight:600}

/* crew view */
.crew{max-width:640px;margin:0 auto;padding:16px 16px 50px}
.crewhead{padding:20px;margin-bottom:14px}
.crewhead h1{font-size:30px}
.crewscore{display:flex;gap:18px;align-items:center;margin-top:14px}
.crewscore .bigscore{border-right:1px solid var(--line);padding-right:18px}
.crewlist{padding:6px 16px}
.crewlist .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.crewlist .it:last-child{border-bottom:0}
.crewlist .pills{padding:0}

@media (max-width:980px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .trow{grid-template-columns:1fr auto;gap:10px}
  .trow .minibars{grid-column:1/-1;order:3}
  .trow .wkcol{order:2}
  .trow .att{display:none}
  .thead{grid-template-columns:1fr}
  .settings{grid-template-columns:1fr}
  .legend{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  .topbar{padding:10px 14px;flex-wrap:wrap}
  .nav{margin-left:0;order:3;width:100%}
  .who{display:none}
  .page{padding:16px 16px 50px}
  .tiles{gap:10px}
  .tile .val{font-size:26px}
  .thead h1{font-size:28px}
  .scorebox{grid-template-columns:90px 1fr}
  .bigscore .n{font-size:44px}
  .legend{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr}
  .grid th.sk,.grid td.sk{min-width:130px;max-width:150px;font-size:12px;padding:4px 8px;white-space:normal}
}
@media print{
  .topbar,.banner,.hbtns,.back,.tabs,.toolbar,#toast,.nav{display:none!important}
  body{background:#fff}
  .card{box-shadow:none}
  .grid-wrap{max-height:none;overflow:visible}
  table.grid{min-width:0;font-size:10px}
  .grid td{height:20px}
  .x{width:18px;height:16px;font-size:11px}
  .page{padding:0}
}

/* trainings */
.trlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.trcard{padding:16px;display:flex;flex-direction:column;gap:8px}
.trcard h3{font-size:21px}
.trcard .sub{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#ece8e0;color:#5c5548}
.chip.gen{background:#e8f1fb;color:var(--training)}
.status{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.status.pass{background:#e7f5ec;color:var(--ok)}
.status.fail{background:#fdecea;color:var(--danger)}
.status.none{background:#eee;color:var(--muted)}
.bookbtn{border:0;background:none;padding:0 0 0 6px;font-size:14px;vertical-align:middle;cursor:pointer}
.viewer{background:#525659;border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:200px}
.viewer canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);border-radius:4px}
.viewer .msg{color:#e6e6e6;padding:40px 10px;text-align:center}
.viewer .msg a{color:#fff}
.viewer iframe{width:100%;height:75vh;border:0;background:#fff;border-radius:4px}
.qcard{padding:16px;margin-bottom:10px}
.qcard .qt{font-weight:700;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.opt.wrong{border-color:var(--danger);background:#fdecea}
.opt.right{border-color:var(--ok);background:#e7f5ec}
.result{padding:20px;text-align:center;margin-bottom:12px}
.result .n{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:52px;font-weight:700;line-height:1}
.qed{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--soft)}
.qed .orow{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;margin-top:6px}
.qed .orow input[type=radio]{width:18px;height:18px;accent-color:var(--ok)}
.skillpick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;columns:2;column-gap:16px}
.skillpick label{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 0;break-inside:avoid;font-weight:600}
.field label.btn{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);cursor:pointer}
.drop{border:2px dashed #cfc8bb;border-radius:10px;padding:16px;text-align:center;color:var(--muted);background:#fff}
@media (max-width:620px){ .skillpick{columns:1} .trlist{grid-template-columns:1fr} }
@media print{ .viewer{display:none} }
</style>

returns json language sql security definer set search_path = public as $$

-- Crew quiz results: saves one quiz attempt for the PIN holder
create or replace function public.mc4u_submit_quiz(p_pin text, p_training text, p_score int, p_passed boolean)
returns json language plpgsql security definer set search_path = public as $$
declare t public.mc4u_trainees; prev jsonb; q jsonb; was_passed boolean;
begin
  select * into t from public.mc4u_trainees where pin = p_pin and active and length(p_pin) >= 4;
  if not found then raise exception 'PIN not found'; end if;
  prev := coalesce(t.data->'quizzes'->p_training, '{}'::jsonb);
  was_passed := coalesce((prev->>'passed')::boolean, false);
  q := jsonb_build_object(
    'last', p_score,
    'best', greatest(coalesce((prev->>'best')::int, 0), p_score),
    'passed', was_passed or p_passed,
    'attempts', coalesce((prev->>'attempts')::int, 0) + 1,
    'at', now(),
    'passed_at', case when was_passed then coalesce(prev->'passed_at', prev->'at')
                      when p_passed then to_jsonb(now()) else null end,
    'pass_score', case when was_passed then coalesce(prev->'pass_score', prev->'best')
                       when p_passed then to_jsonb(p_score) else null end);
  update public.mc4u_trainees
     set data = jsonb_set(coalesce(data,'{}'::jsonb) || jsonb_build_object('quizzes', coalesce(data->'quizzes','{}'::jsonb)),
                          array['quizzes', p_training], q),
         updated_at = now()
   where id = t.id;
  return q;
end $$;
revoke all on function public.mc4u_submit_quiz(text,text,int,boolean) from public;
grant execute on function public.mc4u_submit_quiz(text,text,int,boolean) to anon, authenticated;

const BUCKET = 'mc4u-trainings';
const DEFAULT_PASS = 80;

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='show'+(err?' err':''); clearTimeout(t._h); t._h=setTimeout(()=>t.className='',err?4500:2200); }
function parseDate(s){ if(!s) return null; const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ const d=parseDate(s); return d? d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '—'; }
function isoToday(offsetDays=0){ const d=new Date(); d.setDate(d.getDate()+offsetDays); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function currentWeek(t){
  const h=parseDate(t.hire_date); if(!h) return 1;
  const today=new Date(); today.setHours(0,0,0,0);
  const days=Math.floor((today-h)/86400000);
  return days<0 ? 0 : Math.floor(days/7)+1;
}
const phaseOfWeek = w => PHASES.find(p=>p.weeks.includes(w));
function weekLabel(w){ if(w<=0) return 'Not started'; if(w>WEEKS) return 'Completed'; return 'Wk '+w+' · '+phaseOfWeek(w).label; }
function weekBadge(w){
  const p = w>=1&&w<=WEEKS ? phaseOfWeek(w) : null;
  const bg = p? `var(--${p.key}-bg)` : (w>WEEKS?'#e7f5ec':'#eee');
  const fg = p? `var(--${p.key})` : (w>WEEKS?'var(--ok)':'var(--muted)');
  return `<span class="wkbadge" style="background:${bg};color:${fg}">${esc(weekLabel(w))}</span>`;
}
function normConfig(c){
  c = c && typeof c==='object' ? clone(c) : {};
  if(!Array.isArray(c.skills) || !c.skills.length) c.skills = DEFAULT_SKILLS.map((n,i)=>({id:'s'+(i+1),name:n,active:true}));
  if(!Array.isArray(c.raters)) c.raters = DEFAULT_RATERS.slice();
  c.weights = Object.assign({}, DEFAULT_WEIGHTS, c.weights||{});
  if(!Array.isArray(c.trainings)) c.trainings = clone(DEFAULT_TRAININGS);
  c.trainings.forEach(tr=>{ tr.skills = Array.isArray(tr.skills)?tr.skills:[]; tr.questions = Array.isArray(tr.questions)?tr.questions:[]; if(tr.passMark==null) tr.passMark=DEFAULT_PASS; });
  return c;
}
function normTrainee(t){
  t = clone(t||{});
  t.data = t.data && typeof t.data==='object' ? t.data : {};
  for(const k of ['marks','attendance','stab','stabkot','ratings','quizzes']) if(!t.data[k] || typeof t.data[k]!=='object') t.data[k]={};
  if(t.hire_date) t.hire_date=String(t.hire_date).slice(0,10);
  if(t.active===undefined) t.active=true;
  return t;
}
function stats(t, config){
  const skills = config.skills.filter(s=>s.active);
  const n = skills.length || 1;
  const m = t.data.marks;
  const phases = PHASES.map(p=>{
    const done = skills.filter(s=>p.weeks.some(w=>m[s.id+'|'+w])).length;
    return {...p, done, pct: done/n};
  });
  const W = config.weights;
  const tot = PHASES.reduce((a,p)=>a+(+W[p.key]||0),0) || 1;
  const score = Math.round(phases.reduce((a,p)=>a+p.pct*(+W[p.key]||0),0)/tot*100);
  const cw = currentWeek(t);
  const elapsed = Math.max(0, Math.min(cw, WEEKS));
  let missed = 0;
  for(let w=1; w<=elapsed; w++) missed += +((t.data.attendance[w]||{}).missed||0);
  const att = elapsed ? Math.round((elapsed*5-missed)/(elapsed*5)*100) : null;
  const sk = {STAB:0, KOT:0};
  Object.values(t.data.stabkot).forEach(arr=>(Array.isArray(arr)?arr:[]).forEach(x=>{ sk[x.type==='KOT'?'KOT':'STAB']++; }));
  const rc = {GOOD:0,OK:0,POOR:0};
  Object.values(t.data.ratings).forEach(v=>{ if(rc[v]!=null) rc[v]++; });
  return {phases, score, cw, att, missed, rc, sk, n: skills.length};
}
function skillPhaseDone(t, sid){ return PHASES.map(p=>p.weeks.some(w=>t.data.marks[sid+'|'+w])); }
function pills(t, sid){
  return `<div class="pills">${skillPhaseDone(t,sid).map((d,i)=>`<span class="pill" title="${PHASES[i].label}${d?' — done':''}" style="${d?`background:var(--${PHASES[i].key});color:#fff`:''}">${PHASES[i].short}</span>`).join('')}</div>`;
}
function phaseBars(s){
  return `<div class="phasebars">${s.phases.map(p=>`
    <div class="pb"><span>${p.label}</span><div class="bar"><i style="width:${Math.round(p.pct*100)}%;background:var(--${p.key})"></i></div><span class="r">${p.done}/${s.n}</span></div>`).join('')}</div>`;
}

/* ---------------- storage (Supabase or demo) ---------------- */
const LIVE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const DEMO_KEY = 'mc4u_demo_v3';
let sb = null, demoMem = null;

function demoSeed(){
  const config = normConfig(null);
  config.trainings = clone(DEFAULT_TRAININGS);
  const mk =(name, daysAgo, pin, fill) => {
    const t = normTrainee({id:'d'+pin, name, hire_date: isoToday(-daysAgo), position:'Yard', active:true, pin:String(pin)});
    const cw = currentWeek(t);
    let r = pin*7;
    const rnd = () => (r = (r*9301+49297)%233280)/233280;
    for(let w=1; w<Math.min(cw, WEEKS+1); w++){
      config.skills.forEach(s=>{ if(rnd()<fill/ (phaseOfWeek(w).weeks.length)) t.data.marks[s.id+'|'+w]={by:'demo',at:new Date().toISOString()}; });
      t.data.attendance[w] = {missed: rnd()<0.15 ? 1 : 0, note:''};
    }
    config.raters.slice(0,6).forEach(rn=>{ if(cw>3) t.data.ratings[rn]=RATINGS[Math.floor(rnd()*rnd()*3)]; });
    return t;
  };
  return {config, trainees:[
    mk('Sample — Alex Ortiz', 10, 1111, .55),
    mk('Sample — Dana Price', 40, 2222, .7),
    mk('Sample — Luis Romero', 75, 3333, .8),
    mk('Sample — Sam Whitfield', 100, 4444, .9)
  ]};
}
function demoLoad(){
  if(demoMem) return demoMem;
  try{ const s=localStorage.getItem(DEMO_KEY); if(s){ demoMem=JSON.parse(s); return demoMem; } }catch(e){}
  demoMem = demoSeed(); demoSave(demoMem); return demoMem;
}
function demoSave(d){ demoMem=d; try{ localStorage.setItem(DEMO_KEY, JSON.stringify(d)); }catch(e){} }

const Store = {
  async init(){
    if(!LIVE) return null;
    if(!window.supabase) throw new Error('Could not load the Supabase library. Check your internet connection.');
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const {data} = await sb.auth.getSession();
    return data.session ? {email:data.session.user.email} : null;
  },
  async signIn(email, pw){
    if(LIVE){ const {data,error}=await sb.auth.signInWithPassword({email, password:pw}); if(error) throw error; return {email:data.user.email}; }
    return {email: email || 'demo supervisor'};
  },
  async signOut(){ if(LIVE) await sb.auth.signOut(); },
  async loadAll(){
    if(LIVE){
      const c = await sb.from('mc4u_config').select('data').eq('id',1).maybeSingle();
      if(c.error) throw c.error;
      let config = c.data && c.data.data && c.data.data.skills ? c.data.data : null;
      if(!config){ config = normConfig(null); await this.saveConfig(config); }
      const t = await sb.from('mc4u_trainees').select('*').order('name');
      if(t.error) throw t.error;
      return {config: normConfig(config), trainees: t.data.map(normTrainee)};
    }
    const d = demoLoad();
    return {config: normConfig(d.config), trainees: d.trainees.map(normTrainee)};
  },
  async loadConfig(){
    if(LIVE){ const c=await sb.from('mc4u_config').select('data').eq('id',1).maybeSingle(); if(c.error) throw c.error; return normConfig(c.data && c.data.data); }
    demoMem = null; return normConfig(demoLoad().config);
  },
  async saveConfig(config){
    if(LIVE){ const {error}=await sb.from('mc4u_config').upsert({id:1, data:config, updated_at:new Date().toISOString()}); if(error) throw error; return; }
    const d = demoLoad(); d.config = clone(config); demoSave(d);
  },
  async saveTrainee(t){
    const row = {name:t.name, hire_date:t.hire_date||null, position:t.position||'', active:!!t.active, pin:t.pin||null, data:t.data, updated_at:new Date().toISOString()};
    if(LIVE){
      const q = t.id ? sb.from('mc4u_trainees').update(row).eq('id',t.id) : sb.from('mc4u_trainees').insert(row);
      const {data,error} = await q.select().single();
      if(error){ if(String(error.message).includes('duplicate') || error.code==='23505') throw new Error('That PIN is already used by someone else.'); throw error; }
      return normTrainee(data);
    }
    const d = demoLoad();
    if(row.pin && d.trainees.some(x=>x.pin===row.pin && x.id!==t.id)) throw new Error('That PIN is already used by someone else.');
    if(!t.id){ const n={...row, id:'d'+uid()}; d.trainees.push(n); demoSave(d); return normTrainee(n); }
    const i = d.trainees.findIndex(x=>x.id===t.id);
    d.trainees[i] = {...row, id:t.id}; demoSave(d); return normTrainee(d.trainees[i]);
  },
  async patchTrainee(id, fn){
    let fresh;
    if(LIVE){ const {data,error}=await sb.from('mc4u_trainees').select('*').eq('id',id).single(); if(error) throw error; fresh=normTrainee(data); }
    else fresh = normTrainee(demoLoad().trainees.find(x=>x.id===id));

    return this.saveTrainee(fresh);
  },
  async deleteTrainee(id){

    const d = demoLoad(); d.trainees = d.trainees.filter(x=>x.id!==id); demoSave(d);
  },
  async uploadPdf(file, trainingId){
    if(LIVE){
      const path = trainingId + '/' + Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_');

      if(error) throw error;
      const {data} = sb.storage.from(BUCKET).getPublicUrl(path);
      return {path, url:data.publicUrl, name:file.name, size:file.size};
    }
    const url = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); });
    if(file.size > 3*1024*1024) toast('Demo mode: large PDFs only last until you reload. Go live to keep them.', true);
    return {path:null, url, name:file.name, size:file.size};
  },
  async removePdf(f){ if(LIVE && f && f.path){ await sb.storage.from(BUCKET).remove([f.path]); } },
  async submitQuiz(pin, trainingId, score, passed){
    if(LIVE){
      const {data,error} = await sb.rpc('mc4u_submit_quiz', {p_pin:pin, p_training:trainingId, p_score:score, p_passed:passed});
      if(error) throw error; return data;
    }
    const d = demoLoad(); const t = d.trainees.find(x=>String(x.pin)===String(pin));
    if(!t) throw new Error('PIN not found');
    t.data = t.data||{}; t.data.quizzes = t.data.quizzes||{};
    const prev = t.data.quizzes[trainingId]||{};
    const now = new Date().toISOString();
    const q = {last:score, best:Math.max(prev.best||0,score), passed:!!prev.passed||passed, attempts:(prev.attempts||0)+1, at:now,
      passed_at: prev.passed ? (prev.passed_at||prev.at) : (passed ? now : null),
      pass_score: prev.passed ? (prev.pass_score!=null?prev.pass_score:prev.best) : (passed ? score : null)};
    t.data.quizzes[trainingId] = q; demoSave(d); return q;
  },
  async admin(action, payload={}){
    if(LIVE){
      const {data, error} = await sb.functions.invoke('mc4u-admin', {body:{action, ...payload}});
      if(error){ let m = error.message; try{ const j = await error.context.json(); if(j && j.error) m = j.error; }catch(_){} throw new Error(m); }
      if(data && data.error) throw new Error(data.error);
      return data;
    }

    const em = String(payload.email||'').trim().toLowerCase();
    if(action==='list') return {users: d.supervisors.map(u=>({...u, me:u.id==='demo-me'}))};
    if(action==='create'){

    }

    if(action==='delete'){ if(payload.id==='demo-me') throw new Error("You can't remove your own account."); d.supervisors=d.supervisors.filter(u=>u.id!==payload.id); demoSave(d); return {ok:true}; }
    throw new Error('Unknown action.');
  },
  async changeMyPassword(pw){
    if(String(pw).length<8) throw new Error('Password must be at least 8 characters.');
    if(LIVE){ const {error} = await sb.auth.updateUser({password:pw}); if(error) throw error; }
  },
  async pinLogin(pin){
    if(LIVE){
      const {data,error} = await sb.rpc('mc4u_pin_login', {p_pin:pin});
      if(error) throw error;
      if(!data || !data.trainee) return null;
      return {config:normConfig(data.config), trainee:normTrainee(data.trainee)};
    }
    const d = demoLoad(); const t = d.trainees.find(x=>String(x.pin)===String(pin) && x.active);
    return t ? {config:normConfig(d.config), trainee:normTrainee(t)} : null;
  }
};

  view:'list', currentId:null, tab:'skills', filter:'active', search:'',
  loginTab:'staff', pin:'', crew:null, crewFilter:'all',
  trainingId:null, trPane:'slides', quiz:null, draft:null, crewView:'home', uploading:false
};
const trainingById = (cfg, id) => (cfg.trainings||[]).find(t=>t.id===id);
const trainingsForSkill = (cfg, sid) => (cfg.trainings||[]).filter(t=>t.skills.includes(sid));
const cur = () => S.trainees.find(t=>t.id===S.currentId);

async function mutate(id, fn){
  const t = S.trainees.find(x=>x.id===id); if(!t) return;
  fn(t); render(); S.pendingWrites = (S.pendingWrites||0)+1;
  try{
    const saved = await Store.patchTrainee(id, fn);
    const i = S.trainees.findIndex(x=>x.id===id); if(i>-1) S.trainees[i]=saved;
  }catch(e){ toast('Could not save: '+(e.message||e), true); await reload(); }
  finally{ S.pendingWrites--; }
}
// Apply one change to the LATEST saved settings (never overwrite with an old copy)
async function patchConfig(fn, msg){
  fn(S.config); render(); S.pendingWrites = (S.pendingWrites||0)+1;
  try{
    const fresh = await Store.loadConfig();
    fn(fresh);
    await Store.saveConfig(fresh);
    S.config = normConfig(fresh); render();
    if(msg) toast(msg);
  }catch(e){ toast('Could not save settings: '+(e.message||e), true); await reload(); }
  finally{ S.pendingWrites--; }
}
async function reload(){
  try{ const d=await Store.loadAll(); S.config=d.config; S.trainees=d.trainees; }
  catch(e){ toast('Could not load data: '+(e.message||e), true); }
  render();
}

  const app = $('#app');
  if(!S.role){ app.innerHTML = renderLogin(); return; }
  if(S.role==='crew'){

  }
  let body = '', tr = null;
  if(S.view==='list') body = renderList();

  else if(S.view==='settings') body = renderSettings();
  else if(S.view==='trainings') body = renderTrainings();
  else if(S.view==='training'){ tr = trainingById(S.config, S.trainingId); body = tr ? renderTrainingPage(tr, S.config, 'staff') : renderTrainings(); }
  else if(S.view==='training-edit') body = renderTrainingEditor();
  app.innerHTML = `

}

function filtered(){
  const q = S.search.trim().toLowerCase();
  return S.trainees.filter(t=>{
    if(S.filter==='active' && (!t.active || currentWeek(t)>WEEKS)) return false;
    if(S.filter==='done' && t.active && currentWeek(t)<=WEEKS) return false;
    if(q && !(t.name||'').toLowerCase().includes(q) && !(t.position||'').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}

let jspdfP = null;
function loadJsPDF(){
  if(window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  if(!jspdfP) jspdfP = new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=()=>res(window.jspdf.jsPDF);
    s.onerror=()=>{ jspdfP=null; rej(new Error('Certificate maker failed to load. Check your connection.')); };
    document.head.appendChild(s);
  });
  return jspdfP;
}
function imgSize(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r({w:i.naturalWidth,h:i.naturalHeight}); i.onerror=()=>r({w:1,h:1}); i.src=src; }); }
function certId(t, tr, when){
  const h = s => { let x=0; for(const c of s) x=(x*31+c.charCodeAt(0))>>>0; return x.toString(36).toUpperCase(); };
  return 'MC4U-' + h(String(t.id)+'|'+tr.id+'|'+when).padStart(6,'0').slice(-6);
}
async function makeCertificate(t, tr, q, cfg){
  const jsPDF = await loadJsPDF();
  const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'letter'});
  const W = 792, H = 612, cx = W/2;
  const when = q.passed_at || q.at;
  const score = q.pass_score!=null ? q.pass_score : q.best;
  const dateTxt = new Date(when).toLocaleDateString(undefined,{month:'long', day:'numeric', year:'numeric'});
  // background & borders
  doc.setFillColor(251,248,241); doc.rect(0,0,W,H,'F');
  doc.setDrawColor(28,35,43); doc.setLineWidth(7); doc.rect(20,20,W-40,H-40);
  doc.setDrawColor(224,122,18); doc.setLineWidth(1.6); doc.rect(33,33,W-66,H-66);
  // crest
  const sz = await imgSize(LOGO); const lh = 100, lw = lh*sz.w/sz.h;
  doc.addImage(LOGO, 'PNG', cx-lw/2, 50, lw, lh);
  let y = 50 + lh + 34;
  doc.setTextColor(28,35,43); doc.setFont('helvetica','bold'); doc.setFontSize(26);
  doc.text('CERTIFICATE OF COMPLETION', cx, y, {align:'center', charSpace:2}); y += 30;
  doc.setFont('times','italic'); doc.setFontSize(15); doc.setTextColor(90,96,104);
  doc.text('This certifies that', cx, y, {align:'center'}); y += 40;
  doc.setFont('times','bolditalic'); doc.setTextColor(28,35,43);
  let ns = 38; doc.setFontSize(ns); while(doc.getTextWidth(t.name) > 560 && ns > 22){ ns -= 2; doc.setFontSize(ns); }
  doc.text(t.name, cx, y, {align:'center'}); y += 12;
  doc.setDrawColor(28,35,43); doc.setLineWidth(.8); doc.line(cx-230, y, cx+230, y); y += 26;
  doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.setTextColor(90,96,104);
  doc.text('has successfully completed the MC4 University training', cx, y, {align:'center'}); y += 30;
  doc.setFont('helvetica','bold'); doc.setFontSize(21); doc.setTextColor(196,98,10);
  const tl = doc.splitTextToSize(tr.title, 600); doc.text(tl, cx, y, {align:'center'}); y += 24*tl.length + 2;
  doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(28,35,43);
  doc.text(`and passed the knowledge check with a score of ${score}%`, cx, y, {align:'center'}); y += 18;
  const skillNames = tr.skills.map(id=>(cfg.skills.find(x=>x.id===id)||{}).name).filter(Boolean);
  if(skillNames.length){
    doc.setFontSize(9.5); doc.setTextColor(110,116,124);
    const sl = doc.splitTextToSize('Key skills: ' + skillNames.map(n=>n.charAt(0)+n.slice(1).toLowerCase()).join(' · '), 560);
    doc.text(sl.slice(0,2), cx, y, {align:'center'});
  }
  // signature row
  const by = H - 92;
  doc.setDrawColor(28,35,43); doc.setLineWidth(.8);
  doc.line(110, by, 310, by); doc.line(W-310, by, W-110, by);
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(28,35,43);
  doc.text(dateTxt, 210, by-8, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(110,116,124);
  doc.text('DATE COMPLETED', 210, by+14, {align:'center', charSpace:1});
  doc.text('SUPERVISOR SIGNATURE', W-210, by+14, {align:'center', charSpace:1});
  // footer
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(224,122,18);
  doc.text('NON MAXIMA SED OPTIMA', cx, H-58, {align:'center', charSpace:2});
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,146,154);
  doc.text(`Certificate ID ${certId(t, tr, when)}  ·  ${PROGRAM_NAME.replace('·','-')}`, cx, H-45, {align:'center'});
  const safe = s => String(s).replace(/[^a-zA-Z0-9 _-]+/g,'').trim().replace(/\s+/g,' ');
  doc.save(`MC4U Certificate - ${safe(t.name)} - ${safe(tr.title)}.pdf`);
}

let pdfjsP = null, pdfTok = 0;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!pdfjsP) pdfjsP = new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); };
    s.onerror=()=>{ pdfjsP=null; rej(new Error('Slide viewer failed to load')); };
    document.head.appendChild(s);
  });
  return pdfjsP;
}
function dataUrlToBytes(u){ const b=atob(u.split(',')[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
async function showPdf(file){
  const tok = ++pdfTok;
  const box = () => tok===pdfTok ? $('#viewer') : null;
  if(!box()) return;
  if(!file || !file.url){ box().innerHTML='<div class="msg">No slides uploaded yet.</div>'; return; }
  box().innerHTML='<div class="msg">Loading slides…</div>';
  try{
    const lib = await loadPdfJs();
    const doc = await lib.getDocument(file.url.startsWith('data:') ? {data:dataUrlToBytes(file.url)} : {url:file.url}).promise;
    if(!box()) return;
    const el = box(); el.innerHTML='';
    const target = Math.min(el.clientWidth-24, 1000), dpr = window.devicePixelRatio||1;
    for(let i=1;i<=doc.numPages;i++){
      const page = await doc.getPage(i); if(!box()) return;
      const base = page.getViewport({scale:1}), css = target/base.width;
      const vp = page.getViewport({scale:css*dpr});
      const c = document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.style.width=Math.round(base.width*css)+'px';
      el.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
    }
  }catch(e){
    const el = box(); if(el) el.innerHTML = `<div class="msg">Couldn't show the slides here.<br><br><a href="${esc(file.url)}" target="_blank" rel="noopener" download="${esc(file.name||'training.pdf')}">Open the PDF</a></div>`;
  }
}
function newDraft(){ return {id:'tr_'+uid(), title:'', skills:[], passMark:DEFAULT_PASS, file:null, questions:[]}; }
function blankQ(){ return {q:'', options:['','','',''], answer:0}; }
async function handlePdf(file){
  if(!file || S.uploading) return;
  if(!/\.pdf$/i.test(file.name) && file.type!=='application/pdf'){ toast('That\'s a PowerPoint file. Save it as PDF first (File → Save As → PDF).', true); return; }
  const id = S.draft.id;
  S.uploading = true; render();
  try{
    const f = await Store.uploadPdf(file, id);
    if(S.draft && S.draft.id===id){ S.draft.file = f; toast('Slides uploaded — now click Save training'); }
  }catch(e){ toast('Upload failed: '+(e.message||e), true); }
  finally{ S.uploading = false; render(); }
}
function cleanDraft(d){
  const out = clone(d);
  out.title = out.title.trim();
  out.passMark = Math.max(0, Math.min(100, +out.passMark||0));
  out.questions = out.questions.filter(q=>q.q.trim() && q.options.filter(o=>String(o||'').trim()).length>=2);
  const bad = out.questions.findIndex(q=>!String(q.options[q.answer]||'').trim());
  return {out, bad};
}

const pwField = (id, label, val) => `<div class="field"><label>${label}</label>
  <div style="display:flex;gap:6px"><input class="inp" id="${id}" type="text" minlength="8" required autocomplete="new-password" value="${esc(val||'')}"><button type="button" class="btn sm" data-action="gen-pw" data-for="${id}">New</button></div>
  <div class="note" style="margin:4px 0 0">At least 8 characters. Share it with them privately; they can change it after signing in.</div></div>`;
function formModal(title, fields, submitLabel, onSubmit){
  $('#modal-root').innerHTML = `<div class="overlay" data-action="close-modal-bg"><form class="card modal" id="mform">
    <h2>${title}</h2>${fields}<div class="err-msg" id="merr" style="text-align:left"></div>
    <div class="mfoot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">${submitLabel}</button></div>
  </form></div>`;
  const f = $('#mform'), first = f.querySelector('input'); if(first) first.focus();
  f.onsubmit = async e=>{
    e.preventDefault(); const btn=f.querySelector('button[type=submit]'); btn.disabled=true; $('#merr').textContent='';
    try{ await onSubmit(f); }catch(err){ $('#merr').textContent = err.message||String(err); btn.disabled=false; }
  };
}

/* ---------------- live updates & new versions ---------------- */
let syncTimer = null, syncPending = false, liveChan = null;
function isBusy(){
  const a = document.activeElement;
  return S.uploading || (S.pendingWrites||0)>0 || S.view==='training-edit' || S.view==='training' || !!$('#modal-root').innerHTML
    || (a && a!==document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(()=>syncNow(false), 800); }
async function syncNow(force){
  if(!S.role) return;
  if(!force && isBusy()){ syncPending = true; return; }
  syncPending = false;
  try{
    if(S.role==='staff'){ const d = await Store.loadAll(); S.config = d.config; S.trainees = d.trainees; if(force) S.sups = null; }
    else if(S.role==='crew' && S.crew){
      if(!force && S.crewView!=='home'){ syncPending = true; return; }
      const pin = S.crew.pin, r = await Store.pinLogin(pin); if(r){ S.crew = r; S.crew.pin = pin; }
    }
    const y = window.scrollY; render(); window.scrollTo(0, y);
    if(force) toast('Up to date');
  }catch(e){ if(force) toast('Could not refresh: '+(e.message||e), true); }
}
setInterval(()=>{ if(syncPending) syncNow(false); }, 3000);
function startLive(){
  if(!LIVE || !sb || liveChan) return;
  liveChan = sb.channel('mc4u-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'mc4u_trainees'}, scheduleSync)
    .on('postgres_changes', {event:'*', schema:'public', table:'mc4u_config'}, scheduleSync)
    .subscribe();
}
function stopLive(){ if(liveChan){ try{ sb.removeChannel(liveChan); }catch(_){} liveChan = null; } }
async function checkVersion(){
  if(location.protocol==='file:' || $('#updbar')) return;
  try{
    const r = await fetch(location.pathname+'?v='+Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(new RegExp("APP_VER"+"SION = '([^']+)'"));
    if(m && m[1]!==APP_VERSION){
      const b = document.createElement('div'); b.id='updbar';
      b.innerHTML = `<span>A new version of MC4 University is ready.</span><button class="btn sm primary" data-action="reload-app">Refresh now</button>`;
      document.body.appendChild(b);
    }
  }catch(_){}
}
setInterval(checkVersion, 5*60*1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ scheduleSync(); checkVersion(); } });

/* ---------------- modal ---------------- */
function openTraineeModal(t){
  const isNew = !t;
  t = t || {name:'', hire_date:isoToday(), position:'Yard', active:true, pin:genPin()};
  $('#modal-root').innerHTML = `<div class="overlay" data-action="close-modal-bg"><form class="card modal" id="tform">
    <h2>${isNew?'Add trainee':'Edit details'}</h2>
    <div class="field"><label>Full name</label><input class="inp" id="f_name" required value="${esc(t.name)}"></div>
    <div class="mrow">
      <div class="field"><label>Hire date</label><input class="inp" type="date" id="f_hire" required value="${esc(t.hire_date||'')}"></div>
      <div class="field"><label>Position</label><input class="inp" id="f_pos" value="${esc(t.position||'')}"></div>
    </div>
    <div class="mrow">
      <div class="field"><label>Crew PIN (4–6 digits)</label><input class="inp" id="f_pin" inputmode="numeric" pattern="[0-9]{4,6}" required value="${esc(t.pin||'')}"></div>
      <div class="field"><label>Status</label><select class="inp" id="f_active"><option value="1" ${t.active?'selected':''}>Active</option><option value="0" ${t.active?'':'selected'}>Inactive</option></select></div>
    </div>
    <div class="mfoot">
      ${isNew?'':`<button type="button" class="btn danger left" data-action="delete">Delete</button>`}
      <button type="button" class="btn" data-action="close-modal">Cancel</button>
      <button type="submit" class="btn primary">${isNew?'Add':'Save'}</button>
    </div>
  </form></div>`;
  $('#f_name').focus();
  $('#tform').onsubmit = async e=>{
    e.preventDefault();
    const vals = {name:$('#f_name').value.trim(), hire_date:$('#f_hire').value, position:$('#f_pos').value.trim(), pin:$('#f_pin').value.trim(), active:$('#f_active').value==='1'};
    if(!vals.name) return;
    try{
      if(isNew){
        const saved = await Store.saveTrainee(normTrainee(vals));
        S.trainees.push(saved); S.currentId=saved.id; S.view='trainee'; S.tab='skills';
        toast('Trainee added');
      } else {
        const saved = await Store.patchTrainee(t.id, x=>Object.assign(x, vals));
        const i=S.trainees.findIndex(x=>x.id===t.id); S.trainees[i]=saved; toast('Saved');
      }
      closeModal(); render();
    }catch(err){ toast(err.message||String(err), true); }
  };
}
function closeModal(){ $('#modal-root').innerHTML=''; }
function genPin(){
  const used = new Set(S.trainees.map(t=>t.pin));
  let p; do{ p = String(1000+Math.floor(Math.random()*9000)); }while(used.has(p)); return p;
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action, d = el.dataset;
  if(a==='close-modal-bg'){ if(e.target===el) closeModal(); return; }
  switch(a){
    case 'logintab': S.loginTab=d.v; S.pin=''; render(); break;
    case 'key': return pinKey(d.k);
    case 'logout': stopLive(); S.sups=null; await Store.signOut(); S.role=null; S.user=null; S.crew=null; S.pin=''; S.view='list'; S.crewView='home'; S.quiz=null; S.draft=null; render(); break;
    case 'nav': if(S.uploading && !confirmSafe('Slides are still uploading. Leave anyway? The upload will be lost.')) return; S.view=d.v; render(); window.scrollTo(0,0); break;
    case 'filter': S.filter=d.v; render(); break;
    case 'open': S.currentId=d.id; S.view='trainee'; S.tab='skills'; render(); window.scrollTo(0,0); break;
    case 'tab': S.tab=d.v; render(); break;
    case 'add': openTraineeModal(null); break;
    case 'edit': openTraineeModal(cur()); break;
    case 'close-modal': closeModal(); break;
    case 'print': window.print(); break;
    case 'crewfilter': S.crewFilter=d.v; render(); break;
    case 'refresh': syncNow(true); break;
    case 'cert': {
      const crew = S.role==='crew', t = crew ? S.crew.trainee : cur(), cfg = crew ? S.crew.config : S.config;
      const tr = t && trainingById(cfg, d.tr), q = t && tr && t.data.quizzes[tr.id];
      if(!q || !q.passed) return toast('A certificate is available after passing the quiz.', true);
      el.disabled = true; toast('Making certificate…');
      try{ await makeCertificate(t, tr, q, cfg); toast('Certificate downloaded'); }
      catch(err){ toast(err.message||String(err), true); }
      finally{ el.disabled = false; }
      break;
    }
    case 'reload-app': location.reload(); break;
    case 'gen-pw': { const inp=document.getElementById(d.for); if(inp){ inp.value=genPassword(); inp.focus(); } break; }
    case 'sup-add':
      formModal('Add supervisor', `
        <div class="field"><label>Name</label><input class="inp" id="f_sname" placeholder="e.g. Rob Smith"></div>
        <div class="field"><label>Email</label><input class="inp" id="f_semail" type="email" required></div>
        ${pwField('f_spw','Temporary password', genPassword())}`, 'Add supervisor', async ()=>{
          const email=$('#f_semail').value.trim(), password=$('#f_spw').value;
          await Store.admin('create', {name:$('#f_sname').value.trim(), email, password});
          closeModal(); S.sups=null; render(); toast(`Added ${email}. Send them the app link, email and password.`);
        });
      break;
    case 'sup-pw': {
      const id=d.id, email=d.email;
      formModal('Reset password', `<p class="note">Set a new password for <b>${esc(email)}</b>.</p>${pwField('f_rpw','New password', genPassword())}`, 'Set password', async ()=>{
        await Store.admin('set_password', {id, password:$('#f_rpw').value});
        closeModal(); toast(`Password updated for ${email}. Share it with them privately.`);
      });
      break;
    }
    case 'sup-del': {
      if(!confirmSafe(`Remove ${d.email} as a supervisor? They will no longer be able to sign in.`)) return;
      try{ await Store.admin('delete', {id:d.id}); S.sups=null; render(); toast('Supervisor removed'); }
      catch(err){ toast(err.message||String(err), true); }
      break;
    }
    case 'my-pw':
      formModal('Change my password', `
        <div class="field"><label>New password</label><input class="inp" id="f_np1" type="password" minlength="8" required autocomplete="new-password"></div>
        <div class="field"><label>Type it again</label><input class="inp" id="f_np2" type="password" required autocomplete="new-password"></div>
        <div class="note" style="margin:0">At least 8 characters.</div>`, 'Change password', async ()=>{
          const a=$('#f_np1').value, b=$('#f_np2').value;
          if(a!==b) throw new Error("The two passwords don't match.");
          await Store.changeMyPassword(a); closeModal(); toast('Your password was changed');
        });
      break;
    case 'open-training':
      e.stopPropagation();
      S.trainingId=d.id; S.trPane='slides'; S.quiz=null;
      if(S.role==='crew') S.crewView='training'; else S.view='training';
      render(); window.scrollTo(0,0); break;
    case 'crew-home': S.crewView='home'; S.quiz=null; render(); window.scrollTo(0,0); break;
    case 'tr-pane': S.trPane=d.v; render(); window.scrollTo(0,0); break;
    case 'quiz-retake': S.quiz=null; render(); window.scrollTo(0,0); break;
    case 'quiz-submit': {
      const cfg = S.role==='crew' ? S.crew.config : S.config;
      const tr = trainingById(cfg, S.trainingId); if(!tr || !S.quiz) return;
      const correct = tr.questions.filter((q,i)=>S.quiz.answers[i]===q.answer).length;
      const score = Math.round(correct/tr.questions.length*100), passed = score>=tr.passMark;
      if(S.role==='crew'){
        el.disabled = true;
        try{ const q = await Store.submitQuiz(S.crew.pin, tr.id, score, passed); S.crew.trainee.data.quizzes[tr.id]=q; }
        catch(err){ el.disabled=false; return toast('Could not save your quiz: '+(err.message||err), true); }
      }
      S.quiz.result = {score, passed, correct}; render(); window.scrollTo(0,0); break;
    }
    case 'tr-new': S.draft=newDraft(); S.draft.questions.push(blankQ()); S.view='training-edit'; render(); window.scrollTo(0,0); break;
    case 'tr-edit': S.draft=clone(trainingById(S.config, d.id)); while(S.draft.questions.length===0) S.draft.questions.push(blankQ()); S.draft.questions.forEach(q=>{ while(q.options.length<4) q.options.push(''); }); S.view='training-edit'; render(); window.scrollTo(0,0); break;
    case 'q-add': S.draft.questions.push(blankQ()); render(); break;
    case 'q-del': S.draft.questions.splice(+d.qi,1); render(); break;
    case 'tr-file-remove': S.draft.file=null; render(); break;
    case 'tr-save': {
      if(S.uploading) return toast('Wait for the slides to finish uploading', true);
      const {out, bad} = cleanDraft(S.draft);
      if(!out.title) return toast('Give the training a title', true);
      if(bad>-1) return toast(`Question ${bad+1}: pick which answer is correct`, true);
      const prev = trainingById(S.config, out.id), old = prev ? prev.file : null;
      await patchConfig(c=>{ const i=c.trainings.findIndex(t=>t.id===out.id); if(i>-1) c.trainings[i]=clone(out); else c.trainings.push(clone(out)); }, 'Training saved');
      if(old && old.path && (!out.file || out.file.path!==old.path)) Store.removePdf(old).catch(()=>{});
      S.draft=null; S.view='trainings'; render(); break;
    }
    case 'tr-delete': {
      const tr = trainingById(S.config, S.draft.id);
      if(!confirmSafe(`Delete the training "${tr.title}"? Quiz results already recorded stay in each person's history.`)) return;
      await patchConfig(c=>{ c.trainings = c.trainings.filter(t=>t.id!==tr.id); }, 'Training deleted'); if(tr.file) Store.removePdf(tr.file).catch(()=>{});
      S.draft=null; S.view='trainings'; render(); break;
    }
    case 'delete': {
      const t = cur(); if(!t) return;
      if(!confirmSafe(`Permanently delete ${t.name} and all their records? (To keep their history, set Status to Inactive instead.)`)) return;
      try{ await Store.deleteTrainee(t.id); S.trainees=S.trainees.filter(x=>x.id!==t.id); closeModal(); S.view='list'; render(); toast('Deleted'); }
      catch(err){ toast(err.message||String(err), true); }
      break;
    }
    case 'mark': {
      const t = cur(), key = d.s+'|'+d.w;
      const turnOn = !t.data.marks[key];
      const by = S.user && S.user.email ? S.user.email.split('@')[0] : 'supervisor';
      const at = new Date().toISOString();
      mutate(t.id, x=>{ if(turnOn) x.data.marks[key]={by,at}; else delete x.data.marks[key]; });
      break;
    }
    case 'rate': {
      const t = cur(); const next = t.data.ratings[d.r]===d.v ? null : d.v;
      mutate(t.id, x=>{ if(next) x.data.ratings[d.r]=next; else delete x.data.ratings[d.r]; });
      break;
    }
    case 'skill-move': {
      const sid=d.id, dir=+d.d;
      patchConfig(c=>{ const i=c.skills.findIndex(x=>x.id===sid), j=i+dir; if(i<0||j<0||j>=c.skills.length) return; [c.skills[i],c.skills[j]]=[c.skills[j],c.skills[i]]; });
      break;
    }
    case 'skill-toggle': { const sk=S.config.skills.find(x=>x.id===d.id); if(!sk) return; const on=!sk.active; patchConfig(c=>{ const x=c.skills.find(y=>y.id===d.id); if(x) x.active=on; }, on?'Skill shown':'Skill hidden'); break; }
    case 'skill-add': { const v=$('#newSkill').value.trim(); if(!v) return; const ns={id:uid(),name:v.toUpperCase(),active:true}; patchConfig(c=>{ if(!c.skills.some(x=>x.id===ns.id)) c.skills.push(clone(ns)); },'Skill added'); break; }
    case 'rater-add': { const v=$('#newRater').value.trim(); if(!v) return; const nm=v.toUpperCase(); if(S.config.raters.includes(nm)) return toast('Already on the list', true); patchConfig(c=>{ if(!c.raters.includes(nm)) c.raters.push(nm); },'Team member added'); break; }
    case 'rater-del': { const n=S.config.raters[+d.i]; if(!confirmSafe(`Remove ${n} from the team list? Existing ratings they gave are kept in history.`)) return; patchConfig(c=>{ c.raters=c.raters.filter(x=>x!==n); },'Removed'); break; }
    case 'copy-sql': copyText(SETUP_SQL); break;
    case 'reset-demo': if(!confirmSafe('Reset all demo data back to the samples?')) return; try{localStorage.removeItem(DEMO_KEY);}catch(_){} demoMem=null; await reload(); toast('Demo data reset'); break;
  }
});
function confirmSafe(msg){ try{ return window.confirm(msg); }catch(e){ return true; } }
function copyText(txt){
  const done=()=>toast('Setup SQL copied — paste it into the Supabase SQL Editor');
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed — select the text manually', true); }
  ta.remove();
}

document.addEventListener('change', e=>{
  if(e.target.id==='pdfInput'){ handlePdf(e.target.files[0]); return; }
  const dr = e.target.dataset && e.target.dataset.draft;
  if(dr==='skill'){ const v=e.target.value; S.draft.skills = e.target.checked ? [...new Set([...S.draft.skills, v])] : S.draft.skills.filter(x=>x!==v); return; }
  if(dr==='ans'){ S.draft.questions[+e.target.dataset.qi].answer = +e.target.value; return; }
  const el = e.target.closest('[data-change]'); if(!el) return;
  if(el.dataset.change==='quiz-ans'){
    if(!S.quiz) return; S.quiz.answers[+el.dataset.qi] = +el.value;
    const cfg = S.role==='crew' ? S.crew.config : S.config, tr = trainingById(cfg, S.trainingId);
    const btn = $('#quizSubmit'); if(btn && tr && tr.questions.every((_,i)=>S.quiz.answers[i]!=null)){ btn.disabled=false; btn.style.opacity=''; }
    return;
  }
  const k = el.dataset.change, d = el.dataset;
  if(k.startsWith('sk-')){
    const t = cur(); if(!t) return; const w=d.w;
    let arr = clone(stabWeek(t, w));
    if(k==='sk-count'){
      const n = +el.value;
      const losing = arr.slice(n).filter(x=>(x.note||'').trim()).length;
      if(losing && !confirmSafe(`This removes ${losing} note${losing>1?'s':''} for week ${w}. Continue?`)){ render(); return; }
      arr = arr.slice(0,n); while(arr.length<n) arr.push({type:'STAB', note:''});
    } else if(k==='sk-type'){ arr[+d.i].type = el.value; }
    else { arr[+d.i].note = el.value; }
    mutate(t.id, x=>{ if(arr.length) x.data.stabkot[w]=clone(arr); else delete x.data.stabkot[w]; });
    toast('Saved');
    return;
  }
  if(k.startsWith('att-')||k==='stab'){
    const t = cur(); if(!t) return; const w=d.w, val=el.value;
    mutate(t.id, x=>{
      if(k==='stab'){ if(val.trim()) x.data.stab[w]=val; else delete x.data.stab[w]; }
      else { const a = Object.assign({missed:0,note:''}, x.data.attendance[w]); if(k==='att-missed') a.missed=+val; else a.note=val; x.data.attendance[w]=a; }
    });
    toast('Saved');
    return;
  }
  if(k==='skill-name'){ const v=el.value.trim().toUpperCase(); if(!v) return render(); patchConfig(c=>{ const x=c.skills.find(y=>y.id===d.id); if(x) x.name=v; },'Skill renamed'); }
  if(k==='weight'){ const v=Math.max(0,Math.min(100,+el.value||0)); patchConfig(c=>{ c.weights[d.k]=v; },'Weights saved'); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='search'){ S.search=e.target.value; renderRows(); }
  const dr = e.target.dataset && e.target.dataset.draft; if(!dr || !S.draft) return;
  const qi = +e.target.dataset.qi;
  if(dr==='title') S.draft.title = e.target.value;
  else if(dr==='pass') S.draft.passMark = e.target.value;
  else if(dr==='q') S.draft.questions[qi].q = e.target.value;
  else if(dr==='opt') S.draft.questions[qi].options[+e.target.dataset.oi] = e.target.value;
});
document.addEventListener('submit', async e=>{
  if(e.target.id!=='staffForm') return;
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Signing in…';
  try{
    S.user = await Store.signIn($('#em').value.trim(), $('#pw').value);
    S.role='staff'; S.view='list';
    await reload(); startLive();
  }catch(err){ $('#lerr').textContent = err.message || 'Sign-in failed'; btn.disabled=false; btn.textContent='Sign in'; }
});
document.addEventListener('keydown', e=>{
  if(S.role || S.loginTab!=='crew') { if(e.key==='Escape') closeModal(); return; }
  if(/^[0-9]$/.test(e.key)) pinKey(e.key);
  else if(e.key==='Backspace') pinKey('clr');
  else if(e.key==='Enter') pinKey('go');
});
async function pinKey(k){
  if(k==='clr'){ S.pin=S.pin.slice(0,-1); render(); return; }
  if(k==='go'){
    if(S.pin.length<4){ $('#lerr').textContent='PIN is at least 4 digits'; return; }
    try{
      const r = await Store.pinLogin(S.pin);
      if(!r){ S.pin=''; render(); $('#lerr').textContent='PIN not found. Check with your supervisor.'; return; }
      S.crew=r; S.crew.pin=S.pin; S.role='crew'; S.pin=''; S.crewFilter='all'; S.crewView='home'; render();
    }catch(err){ S.pin=''; render(); $('#lerr').textContent=err.message||'Sign-in failed'; }
    return;
  }
  if(S.pin.length<6){ S.pin+=k; render(); }
}

/* ---------------- start ---------------- */
(async function start(){
  try{
    const user = await Store.init();
    if(user){ S.user=user; S.role='staff'; await reload(); startLive(); return; }
  }catch(e){ toast(e.message||String(e), true); }
  render();
})();
setTimeout(checkVersion, 10000);
</script>
